services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      OPENBLAS_NUM_THREADS: "1"
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
